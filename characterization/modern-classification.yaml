  - transcript: book_open_session_partner
    adr: "section 1 (transcript listed)"
    reason: >-
      Partner bookings take one seat (no double decrement): the derived count differs from the legacy SeatsAvailable counter after a partner booking.
    fields: ["business.seatsAvailable", "db_state.examSession.*.SeatsAvailable"]
