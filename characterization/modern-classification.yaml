# Modern-target classification for `characterization/replay --target modern` (MBA-3825, M6).
#
# adr_divergences: a transcript only counts as ADR-APPROVED DIVERGENCE when docs/adr/0002-ported-rule-decisions.md
#   records the rule (section cited in `adr`) AND every differing field is under one of the `fields` prefixes
#   (diff paths as printed in the report) AND the `signature` business fields (if any) are present. Anything else
#   in the same transcript stays a MISMATCH.
# not_replayable: the legacy entry point the transcript drives was retired by M4/M5 and has no modern equivalent.
#   The replay still runs the scenario's other steps where it can; the scenario is reported as
#   "NOT REPLAYABLE (retired legacy surface)" with the reason and the transcripts that cover the behaviour on the
#   modern stack. Never counted as MATCH.

