    fields: ["business.driftSessions", "business.totalDrift"]
  - transcript: mixed_traffic_then_capacity_sync
    adr: "section 7 (transcript listed)"
    reason: >-
      Mixed portal/partner traffic then a capacity-sync run: on legacy the partner double decrement (HB-01) made
      sessions 154/157 look full, so their last bookings were waitlisted, and formula B (HB-03) left drift
      (reports/drift-before-after.md: 112 before, 0 after). On modern those bookings are seated, nothing is
      waitlisted and seat-drift.sql reports 0. Only booking status in 154/157, their waitlists, seat counters and
      the drift counters may differ.
    fields: ["step3.business.driftSessions", "step3.business.totalDrift", "step5.business.driftSessions",
             "step5.business.totalDrift", "business.driftSessions", "business.totalDrift",
             "db_state.bookings.154[[]*].status", "db_state.bookings.157[[]*].status",
             "db_state.waitlist.154", "db_state.waitlist.157", "db_state.examSession.*.SeatsAvailable"]
