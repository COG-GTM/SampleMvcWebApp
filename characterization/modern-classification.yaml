  - transcript: accommodation_blank_uses_default_portal
    adr: "section 6a (transcript listed)"
    reason: >-
      The API books exactly what it is sent; the legacy portal substituted the candidate DefaultAccommodationCode server-side (the modern UI pre-fills it in the form instead, which an API-level replay does not exercise).
