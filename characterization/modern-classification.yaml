  - transcript: reschedule_same_session_portal
    adr: "section 6b (transcript listed)"
    reason: >-
      Same-session reschedule is rejected with 409 SAME_SESSION for every channel; usp_RescheduleBooking re-booked the same seat.
    fields: ["business.bookingId", "business.error", "business.outcome", "db_state.bookings.462"]
    signature: {error: SAME_SESSION}
  - transcript: capacity_sync_fresh_seed_system
    adr: "section 3 (transcript listed)"
    reason: >-
      Formula A everywhere; capacity-sync no longer rewrites seats with formula B, so the sync run reports no drift (and section 1 removes the partner drift it used to heal).
    fields: ["business.driftSessions", "business.totalDrift"]
  - transcript: capacity_sync_with_accommodation_bookings
    adr: "section 3 (transcript listed)"
