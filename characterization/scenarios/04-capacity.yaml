# Capacity changes via /Admin/Sessions/Capacity/{id} (usp_ChangeCapacity + trg_ExamSession_Update).
# Session 154: Capacity 20, AccommodationCapacity 2, 9 BOOKED seed bookings, 11 free seats.
scenarios:
  - id: CP-01-portal-capacity-increase
    title: Admin raises capacity 20 -> 25 - SeatsAvailable +5, no booking or waitlist row changes
    area: capacity
    channel: portal
    hb: [HB-05]
    sessions: [154]
    steps:
      - portal_capacity: {session: 154, capacity: 25}

  - id: CP-02-portal-capacity-decrease-above-active
    title: Admin lowers capacity 20 -> 12, still above the 9 active bookings - nobody demoted
    area: capacity
    channel: portal
    hb: [HB-05]
    sessions: [154]
    steps:
      - portal_capacity: {session: 154, capacity: 12}

  - id: CP-03-portal-capacity-decrease-below-active
    title: Admin lowers capacity 20 -> 6, below the 9 active bookings - newest 3 BOOKED rows demoted to WAITLISTED
    area: capacity
    channel: portal
    hb: [HB-05]
    oddity: true
    oddity_ids: [ODD-02]
    sessions: [154]
    steps:
      - portal_capacity: {session: 154, capacity: 6}

  - id: CP-04-portal-capacity-raise-then-lower
    title: Admin raises 20 -> 24, lowers to 10 (above active), then to 7 (below active) - full before/after row state
    area: capacity
    channel: portal
    hb: [HB-05]
    oddity: true
    oddity_ids: [ODD-02]
    sessions: [154]
    steps:
      - portal_capacity: {session: 154, capacity: 24}
      - portal_capacity: {session: 154, capacity: 10}
      - portal_capacity: {session: 154, capacity: 7}

  - id: CP-05-portal-capacity-below-accommodation
    title: Admin lowers capacity to 1, below AccommodationCapacity 2 - usp_ChangeCapacity rejects (strict rule, PR 51 not in baseline)
    area: capacity
    channel: portal
    hb: [HB-05, HB-14]
    oddity: true
    oddity_ids: [ODD-06, ODD-12]
    sessions: [154]
    steps:
      - portal_capacity: {session: 154, capacity: 1}

  - id: CP-06-db-capacity-below-accommodation-error
    title: usp_ChangeCapacity called directly with 1 < AccommodationCapacity 2 - raw RAISERROR number/state 5
    area: capacity
    channel: db
    hb: [HB-14]
    oddity: true
    oddity_ids: [ODD-06, ODD-11]
    sessions: [154]
    steps:
      - db_proc: "EXEC dbo.usp_ChangeCapacity @SessionId = 154, @NewCapacity = 1, @Actor = 'characterization';"

  - id: CP-07-portal-capacity-decrease-demotes-newest-mixed-channels
    title: Portal + partner bookings, then capacity lowered to 10 - the newest (partner) booking is demoted first
    area: capacity
    channel: portal
    hb: [HB-05, HB-01]
    oddity: true
    oddity_ids: [ODD-02, ODD-01]
    sessions: [154]
    candidates: [NW00000930, NW00000931]
    setup:
      - portal_book: {session: 154, candidate: NW00000930}
      - api_book: {session: 154, candidate: NW00000931, external_ref: PX-4007}
    steps:
      - portal_capacity: {session: 154, capacity: 10}

  - id: CP-08-portal-capacity-equal-to-accommodation
    title: Admin lowers capacity to exactly AccommodationCapacity 2 (allowed) - 7 newest bookings demoted
    area: capacity
    channel: portal
    hb: [HB-05]
    oddity: true
    oddity_ids: [ODD-02]
    sessions: [154]
    steps:
      - portal_capacity: {session: 154, capacity: 2}

  - id: CP-09-db-capacity-decrease-below-active
    title: usp_ChangeCapacity called directly 20 -> 6 (the path every caller shares) - trigger 033 demotes the newest 3 BOOKED rows
    area: capacity
    channel: db
    hb: [HB-05]
    oddity: true
    oddity_ids: [ODD-02]
    sessions: [154]
    steps:
      - db_proc: "EXEC dbo.usp_ChangeCapacity @SessionId = 154, @NewCapacity = 6, @Actor = 'characterization';"
