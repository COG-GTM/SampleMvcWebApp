# Retake eligibility (Exam CTA-NET1, RetakeWaitDays = 30). Setup inserts a DELIVERED BOS01 session, an ATTENDED
# booking and a Result row for the candidate; each date is checked through both channels.
group: retake_eligibility
scenarios:
- name: retake_inside_window_portal
  channel: PORTAL
  description: 'Fail on Fri 2026-10-30; check 2026-11-20 (21 days later): both channels refuse.'
  candidates:
  - NW00000950
  sessions: []
  steps:
  - op: eligibility
    candidate: NW00000950
    examCode: CTA-NET1
    date: '2026-11-20'
  setup_sql:
  - "DECLARE @c INT = (SELECT CandidateId FROM dbo.Candidate WHERE CandidateNumber = 'NW00000950');\nINSERT dbo.ExamSession (ExamId, TestCenterId,\
    \ RoomId, StartsAt, Capacity, AccommodationCapacity, SeatsAvailable, Status, LastModified)\n  VALUES (7, 1, 1, '2026-10-30T09:00:00', 10,\
    \ 0, 9, 'DELIVERED', '2026-10-30T09:00:00');\nDECLARE @s INT = SCOPE_IDENTITY();\nINSERT dbo.Booking (SessionId, CandidateId, Status, Channel,\
    \ BookedAt, LastModified)\n  VALUES (@s, @c, 'ATTENDED', 'PORTAL', '2026-09-01T10:00:00', '2026-10-30T09:00:00');\nINSERT dbo.Result (BookingId,\
    \ CandidateId, ExamId, SessionId, Score, Passed, ScoredAt, SourceFile, ReceivedAt)\n  VALUES (SCOPE_IDENTITY(), @c, 7, @s, 512, 0, DATEADD(DAY,\
    \ 3, '2026-10-30T09:00:00'), 'NW_SCORES_CTA_CHAR.csv', DATEADD(DAY, 3, '2026-10-30T09:00:00'));"
  oddity: true
  oddity_note: Channels agree on eligible but disagree on earliestRetakeDate (portal attempt + 30 calendar days, booking-api attempt + 30 working
    days).
  tags:
  - channel-disagreement
  - working-days
  modern_expected_mismatch: ADR 0002 - one retake rule for both channels; the losing channel's earliestRetakeDate mismatches.
