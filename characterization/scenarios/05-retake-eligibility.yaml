  - id: RT-08-eligibility-nw00000950-2026-11-27
    title: "Retake eligibility NW00000950 BCB-PM200 on 2026-11-27: inside a month-end-spanning window"
    area: retake
    channel: both
    hb: [HB-07]
    candidates: [NW00000950]
    setup:
      - sql: >-
          DECLARE @c INT = (SELECT CandidateId FROM dbo.Candidate WHERE CandidateNumber = 'NW00000950');
          DECLARE @e INT = (SELECT ExamId FROM dbo.ExamSession WHERE SessionId = 126);
          INSERT dbo.Booking (SessionId, CandidateId, Status, AccommodationCode, Channel, BookedAt, LastModified)
          VALUES (126, @c, 'ATTENDED', NULL, 'IMPORT', '20261001 10:00', '20261030 12:00');
          INSERT dbo.Result (BookingId, CandidateId, ExamId, SessionId, Score, Passed, ScoredAt, SourceFile, ReceivedAt)
          VALUES (SCOPE_IDENTITY(), @c, @e, 126, 480, 0, '20261030 12:00', 'characterization-setup.csv', '20261030 13:00');
    steps:
