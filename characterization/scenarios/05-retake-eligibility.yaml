# Retake eligibility side by side: portal /Eligibility (RetakeRules.Check, calendar days) vs booking-api
# GET /api/v1/candidates/{n}/eligibility (RetakeEligibilityService, DateUtils.addWorkingDays). Exam.RetakeWaitDays = 30.
# Weekend case (HB-07): NW00000113 failed HPI-ACC1 on Sat 2026-11-07 -> calendar 2026-12-07, working days 2026-12-18.
# Month-end case: setup gives NW00000950 a failed BCB-PM200 attempt on Fri 2026-10-30 (session 126)
#   -> calendar 2026-11-29 (a Sunday), working days 2026-12-11; the window spans the Oct/Nov and Nov/Dec month ends.
scenarios:
  - id: RT-01-eligibility-nw00000113-2026-11-20
    title: "Retake eligibility NW00000113 HPI-ACC1 on 2026-11-20: inside the window (both channels say not yet)"
    area: retake
    channel: both
    hb: [HB-07]
    candidates: [NW00000113]
    steps:
      - portal_eligibility: {candidate: NW00000113, exam: HPI-ACC1, date: "2026-11-20"}
      - api_eligibility: {candidate: NW00000113, exam: HPI-ACC1, date: "2026-11-20"}

  - id: RT-02-eligibility-nw00000113-2026-12-06
    title: "Retake eligibility NW00000113 HPI-ACC1 on 2026-12-06: day before the calendar boundary"
