    channel: PARTNER
    finding: [HB-14]
    tests: [CT-34]
    description: GET /api/v1/sessions lists every status ordered by StartsAt; GET /api/v1/sessions/{id} includes the live booked count.
    sessions: [462]
    steps:
      - {op: sessions, centerCode: BOS01, from: "2026-09-01", to: "2026-12-31"}
