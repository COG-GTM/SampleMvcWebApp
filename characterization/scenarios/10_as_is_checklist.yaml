  - name: session_search_portal
    group: contracts
    channel: PORTAL
    finding: [HB-10, HB-14]
    tests: [CT-35]
    description: Portal search lists OPEN sessions only (462 listed; delivered 147 and closed 281 not) and only active centres in the filter.
    steps:
      - {op: search, centerCode: BOS01, probe: [462, 147, 281]}
  - name: book_inactive_center_portal
    group: booking
    channel: PORTAL
    finding: [HB-10]
    tests: [CT-35]
    oddity: true
    oddity_note: With SEA01 marked inactive it disappears from the portal's centre filter, yet its session 205 is still bookable.
    sessions: [205]
