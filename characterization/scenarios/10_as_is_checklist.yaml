      - "UPDATE dbo.TestCenter SET IsActive = 0 WHERE TestCenterId = 7"
    steps:
      - {op: search, centerCode: SEA01, probe: [205]}
      - {op: book, session: 205, candidate: NW00000901}
  - name: book_inactive_center_partner
    group: booking
    channel: PARTNER
    finding: [HB-10, HB-01]
    tests: [CT-35]
    oddity: true
    oddity_note: booking-api books session 205 of inactive centre SEA01 (and double-decrements).
    sessions: [205]
    setup_sql:
      - "UPDATE dbo.TestCenter SET IsActive = 0 WHERE TestCenterId = 7"
    steps:
      - {op: book, session: 205, candidate: NW00000901, externalRef: NAN-REF-0046}
  - name: result_ingest_marks_attended_system
    group: mixed_traffic
    channel: SYSTEM
    finding: [HB-12, HB-03]
    tests: [CT-36]
    oddity: true
    oddity_note: Ingesting a result flips booking 3319 to ATTENDED as a side effect without touching SeatsAvailable; seat-drift stays clean because it counts ATTENDED as held.
    sessions: [147]
    candidates: [NW00000492]
    steps:
      - {op: result, booking: 3319, score: 72}
      - {op: drift}
