# scheduling-service (MBA-3821). Every value can be overridden with the env var shown.
server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: always

spring:
  application:
    name: scheduling-service
  datasource:
    # Own database "Scheduling" - never AssessmentDelivery. Created on start-up when missing
    # (config/SchedulingDatabaseBootstrap) and migrated by Flyway (db/migration).
    url: ${SCHEDULING_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Scheduling;encrypt=true;trustServerCertificate=true}
    username: ${SCHEDULING_DB_USER:sa}
    password: ${SCHEDULING_DB_PASSWORD:Str0ng!Passw0rd}
    hikari:
      # keeps readiness answering quickly (DOWN) while the Scheduling DB is unreachable
      connection-timeout: ${SCHEDULING_DB_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Probes and metrics (MBA-3832): docs/runbooks/scheduling-service.md
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: ${SCHEDULING_HEALTH_SHOW_DETAILS:never}
      group:
        liveness:
          include: livenessState
        readiness:
          # schedulingSchema = Flyway finished with nothing pending; legacySource = ad_sched_import source reachable
          include: ${SCHEDULING_READINESS_INCLUDE:readinessState,db,schedulingSchema,legacySource}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

scheduling:
  database:
    create-if-missing: ${SCHEDULING_DB_CREATE:true}
  # Read-only source for the snapshot importer: login ad_sched_import (db/security/035_sched_import_login.sql).
  legacy:
    url: ${SCHEDULING_LEGACY_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AssessmentDelivery;encrypt=true;trustServerCertificate=true;applicationIntent=ReadOnly}
    username: ${SCHEDULING_LEGACY_DB_USER:ad_sched_import}
    password: ${SCHEDULING_LEGACY_DB_PASSWORD:Sch3dImport!Dev2026}
  import:
    # true = import snapshots + seat inventory on start-up when the Scheduling DB has no sessions yet
    on-startup: ${SCHEDULING_IMPORT_ON_STARTUP:true}
  # Rule switches - decisions and transcript evidence in docs/adr/0002-ported-rule-decisions.md
  rules:
    retake-days: ${SCHEDULING_RULES_RETAKE_DAYS:calendar}            # calendar (portal RetakeRules.cs) | working (booking-api DateUtils.addWorkingDays)
    accommodation-floor: ${SCHEDULING_RULES_ACCOMMODATION_FLOOR:allocated}  # allocated (usp_ChangeCapacity) | booked
  # Stand-in for the M3 routing gateway (GET /api/v2/internal/routing/resolve): centres served by this service.
  routing:
    modern-centers: ${SCHEDULING_ROUTING_MODERN_CENTERS:}
    default-target: ${SCHEDULING_ROUTING_DEFAULT_TARGET:legacy}
  # Default Booking.channel for /api/v2 + /app (the portal replacement); /api/v1 compat records PARTNER.
  # Same vocabulary as legacy CK_Booking_Channel so the M4 outbox can write it back unchanged.
  default-channel: PORTAL
  actor: ${SCHEDULING_ACTOR:scheduling-service}
  # MBA-3823: service credential for POST /api/v2/bookings/{id}/attendance (header X-Service-Token, results-service).
  # No default: unset = every attendance call is refused (fail closed); the run scripts set a dev value.
  attendance:
    service-token: ${SCHEDULING_ATTENDANCE_SERVICE_TOKEN:}
  # MBA-3823 outbox relay: projects every outbox_event into AssessmentDelivery as ad_sched_relay
  # (db/security/036_component_logins.sql). Local-dev password like scheduling.legacy; Azure uses the env var.
  relay:
    enabled: ${SCHEDULING_RELAY_ENABLED:true}
    url: ${SCHEDULING_RELAY_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AssessmentDelivery;encrypt=true;trustServerCertificate=true}
    username: ${SCHEDULING_RELAY_DB_USER:ad_sched_relay}
    password: ${SCHEDULING_RELAY_DB_PASSWORD:Sch3dRelay!Dev2026}
    poll-ms: ${SCHEDULING_RELAY_POLL_MS:250}
    batch-size: ${SCHEDULING_RELAY_BATCH_SIZE:200}
  # MBA-3829 waitlist auto-offer (ADR 0005): a freed seat is held for the next eligible waitlisted candidate for
  # offer-ttl (ISO-8601 duration); the expiry job checks every expiry-poll and moves expired offers on.
  waitlist:
    offer-ttl: ${SCHEDULING_WAITLIST_OFFER_TTL:PT24H}
    expiry-enabled: ${SCHEDULING_WAITLIST_EXPIRY_ENABLED:true}
    expiry-poll: ${SCHEDULING_WAITLIST_EXPIRY_POLL:PT1M}
  # GET /internal/reconciliation and the `reconcile` CLI write reports/reconciliation-<ts>.md
  reconciliation:
    report-dir: ${SCHEDULING_RECONCILIATION_REPORT_DIR:reports}
    seat-drift-sql: ${SCHEDULING_SEAT_DRIFT_SQL:db/checks/seat-drift.sql}

logging:
  level:
    com.northwind: INFO
