# MBA-3833: public OpenAPI document (GET /v3/api-docs, /swagger-ui.html), loaded by web/OpenApiConfig.
# Only the public /api/v2 surface; operator endpoints (/api/v2/internal/**) and the /api/v1 compatibility
# facade are not part of it. The committed copy is api/openapi.yaml (OpenApiSpecIT fails on drift).
springdoc.paths-to-match=/api/v2/**
springdoc.paths-to-exclude=/api/v2/internal/**
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
