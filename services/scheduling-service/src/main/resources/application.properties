# scheduling-service - local development (see README.md)
server.port=${SCHEDULING_PORT:8084}
spring.application.name=scheduling-service

# Own database (Scheduling) on the estate SQL Server. Created by db/bootstrap.sql; schema managed by Flyway.
spring.datasource.url=${SCHEDULING_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Scheduling;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SCHEDULING_DB_USER:ad_app}
spring.datasource.password=${SCHEDULING_DB_PASSWORD:Northw1nd!Dev2011}
spring.datasource.hikari.maximum-pool-size=${SCHEDULING_DB_POOL:20}
spring.flyway.locations=classpath:db/migration

# Read-only source for the reference-data relay and the initial import (AssessmentDelivery).
scheduling.source.url=${AD_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AssessmentDelivery;encrypt=false;trustServerCertificate=true}
scheduling.source.username=${AD_DB_USER:ad_app}
scheduling.source.password=${AD_DB_PASSWORD:Northw1nd!Dev2011}

# Initial import of ExamSession/Booking/Waitlist/AuditLog from AssessmentDelivery: if-empty | always | never
scheduling.import.on-startup=${SCHEDULING_IMPORT:if-empty}
# Reference-data relay (SQL Server Change Tracking on Exam/TestCenter/Room/Candidate). Poll interval in ms, 0 = off.
scheduling.reference.poll-ms=${SCHEDULING_REF_POLL_MS:30000}
scheduling.reference.stale-after-seconds=300

# HB-01/HB-02: a PARTNER BOOKED booking takes two seats (booking-api decrement + trg_Booking_SeatSync). Contract section 6.
scheduling.legacy-seat-accounting=true
# Seat reconciler (ex capacity-sync NightlySyncJob, 02:00). "-" disables the schedule; POST /reconciler/runs still works.
scheduling.reconciler.cron=${SCHEDULING_RECONCILER_CRON:0 0 2 * * *}
scheduling.reconciler.actor=capacity-sync
# Legacy direct-write compatibility API (/api/v1/admin/storage). Off by default; characterization and dual-run only.
scheduling.storage-api.enabled=${SCHEDULING_STORAGE_API:false}
scheduling.idempotency.retention-days=7

spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info
logging.level.com.northwind=INFO
