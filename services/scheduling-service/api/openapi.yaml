          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionDto"
          description: OK
        "400":
          content:
            application/json:
              examples:
                VALIDATION:
                  summary: VALIDATION
                  value:
                    error: VALIDATION
                    legacyCode: null
                    message: sessionId and candidateNumber are required
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: VALIDATION"
        "404":
          content:
            application/json:
              examples:
                CENTER_NOT_FOUND:
                  summary: CENTER_NOT_FOUND
                  value:
                    error: CENTER_NOT_FOUND
                    legacyCode: null
                    message: Center NOPE not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: CENTER_NOT_FOUND"
      summary: Search a centre's sessions (optional exam and date range)
      tags:
      - Sessions
  /api/v2/exams:
    get:
      operationId: exams
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamDto"
          description: OK
      summary: List published exams
      tags:
      - Reference data
  /api/v2/offers/{offerId}:
