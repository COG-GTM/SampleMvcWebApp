            application/json:
              schema:
                $ref: "#/components/schemas/OfferDto"
          description: OK
        "400":
          content:
            application/json:
              examples:
                BAD_REQUEST:
                  summary: BAD_REQUEST
                  value:
                    error: BAD_REQUEST
                    message: Failed to convert value of type 'java.lang.String' to
                      required type 'int'
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: BAD_REQUEST"
        "404":
          content:
            application/json:
              examples:
                OFFER_NOT_FOUND:
                  summary: OFFER_NOT_FOUND
                  value:
                    error: OFFER_NOT_FOUND
                    legacyCode: null
                    message: Offer 99999 not found
              schema:
                $ref: "#/components/schemas/OfferError"
          description: "Not found: OFFER_NOT_FOUND"
      summary: Get a waitlist seat offer
      tags:
      - Offers
  /api/v2/offers/{offerId}/accept:
