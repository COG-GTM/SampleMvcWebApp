openapi: 3.0.1
info:
  description: |
    Test-centre scheduling API of the Northwind Assessment Network (scheduling-service, MBA-3821).
    Consumers: the modern UI under `/app` and the routing gateway's `/api/v1` -> `/api/v2` translation (M3).
    The committed contract is `services/scheduling-service/api/openapi.yaml`; breaking changes against
    `api/baseline/` fail the build (OpenApiCompatibilityTest). Rule decisions: docs/adr/0002-ported-rule-decisions.md.

    ## Errors
    Every 4xx is an `ApiError`: `error` is the symbolic code, `message` is human readable, and `legacyCode` is
    `50000 + RAISERROR state` of the legacy procs (ODD-11, HB-14), e.g. `NO_ACCOMMODATION_SEAT` = 50003, or
    null when the rule never existed as a proc error. Malformed input (unreadable JSON, wrong path/param type)
    answers `BAD_REQUEST` without `legacyCode`. The offer operations (MBA-3829) answer `OFFER_NOT_FOUND` and
    `OFFER_NOT_PENDING` as an `OfferError` (same shape).

    | error | HTTP | legacyCode |
    |---|---|---|
    | `VALIDATION` | 400 | null |
    | `BAD_REQUEST` | 400 | null |
    | `UNAUTHORIZED` | 401 | null |
    | `CANDIDATE_NOT_FOUND` | 404 | null |
    | `SESSION_NOT_FOUND` | 404 | null |
    | `BOOKING_NOT_FOUND` | 404 | null |
    | `EXAM_NOT_FOUND` | 404 | null |
    | `CENTER_NOT_FOUND` | 404 | null |
    | `SESSION_NOT_OPEN` | 409 | 50001 |
    | `DUPLICATE_BOOKING` | 409 | 50002 |
    | `NO_ACCOMMODATION_SEAT` | 409 | 50003 |
    | `NOT_CANCELLABLE` | 409 | 50004 |
    | `INVALID_CAPACITY` | 409 | 50005 |
    | `DIFFERENT_EXAM` | 409 | 50006 |
    | `SAME_SESSION` | 409 | null |
    | `NOT_ELIGIBLE` | 409 | null |
    | `OFFER_NOT_FOUND` | 404 | null |
    | `OFFER_NOT_PENDING` | 409 | null |
  title: Northwind Scheduling API
  version: 2.0.0
servers:
- description: scheduling-service (default :8090)
  url: /
tags:
- name: Bookings
- name: Candidates
- name: Capacity
- name: Offers
- name: Reference data
- name: Sessions
paths:
  /api/v2/bookings:
    post:
      operationId: book
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResultDto"
          description: Created
        "400":
          content:
            application/json:
              examples:
                VALIDATION:
                  summary: VALIDATION
                  value:
                    error: VALIDATION
                    legacyCode: null
                    message: sessionId and candidateNumber are required
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: VALIDATION"
        "404":
          content:
            application/json:
              examples:
                CANDIDATE_NOT_FOUND:
                  summary: CANDIDATE_NOT_FOUND
                  value:
                    error: CANDIDATE_NOT_FOUND
                    legacyCode: null
                    message: Candidate NW00009999 not found
                SESSION_NOT_FOUND:
                  summary: SESSION_NOT_FOUND
                  value:
                    error: SESSION_NOT_FOUND
                    legacyCode: null
                    message: Session 99999 not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: CANDIDATE_NOT_FOUND, SESSION_NOT_FOUND"
        "409":
          content:
            application/json:
              examples:
                DUPLICATE_BOOKING:
                  summary: DUPLICATE_BOOKING (legacy 50002)
                  value:
                    error: DUPLICATE_BOOKING
                    legacyCode: 50002
                    message: Candidate NW00000901 already has an active booking on
                      session 154
                NOT_ELIGIBLE:
                  summary: NOT_ELIGIBLE
                  value:
                    error: NOT_ELIGIBLE
                    legacyCode: null
                    message: "Candidate NW00000939 is not eligible to book MHL-RN1\
                      \ (RETAKE_WAIT_NOT_ELAPSED), earliest retake date 2026-12-07"
                NO_ACCOMMODATION_SEAT:
                  summary: NO_ACCOMMODATION_SEAT (legacy 50003)
                  value:
                    error: NO_ACCOMMODATION_SEAT
                    legacyCode: 50003
                    message: No accommodation seat available on session 155
                SESSION_NOT_OPEN:
                  summary: SESSION_NOT_OPEN (legacy 50001)
                  value:
                    error: SESSION_NOT_OPEN
                    legacyCode: 50001
                    message: Session 263 is not open for booking
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Rule violation: SESSION_NOT_OPEN, DUPLICATE_BOOKING, NO_ACCOMMODATION_SEAT,\
            \ NOT_ELIGIBLE"
      summary: "Book a seat (WAITLISTED when the session is full); returns the legacy\
        \ {bookingId, status} plus the live booking and session"
      tags:
      - Bookings
  /api/v2/bookings/{bookingId}:
    delete:
      operationId: cancel
      parameters:
      - in: path
        name: bookingId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: reason
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDto"
          description: OK
        "400":
          content:
            application/json:
              examples:
                BAD_REQUEST:
                  summary: BAD_REQUEST
                  value:
                    error: BAD_REQUEST
                    message: Failed to convert value of type 'java.lang.String' to
                      required type 'int'
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: BAD_REQUEST"
        "404":
          content:
            application/json:
              examples:
                BOOKING_NOT_FOUND:
                  summary: BOOKING_NOT_FOUND
                  value:
                    error: BOOKING_NOT_FOUND
                    legacyCode: null
                    message: Booking 99999 not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: BOOKING_NOT_FOUND"
        "409":
          content:
            application/json:
              examples:
                NOT_CANCELLABLE:
                  summary: NOT_CANCELLABLE (legacy 50004)
                  value:
                    error: NOT_CANCELLABLE
                    legacyCode: 50004
                    message: Booking 1201 is CANCELLED
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Rule violation: NOT_CANCELLABLE"
      summary: "Cancel a booking (frees the seat; it is offered to the next eligible\
        \ waitlist entry, MBA-3829 / ADR 0005)"
      tags:
      - Bookings
    get:
      operationId: booking
      parameters:
      - in: path
        name: bookingId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDto"
          description: OK
        "400":
          content:
            application/json:
              examples:
                BAD_REQUEST:
                  summary: BAD_REQUEST
                  value:
                    error: BAD_REQUEST
                    message: Failed to convert value of type 'java.lang.String' to
                      required type 'int'
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: BAD_REQUEST"
        "404":
          content:
            application/json:
              examples:
                BOOKING_NOT_FOUND:
                  summary: BOOKING_NOT_FOUND
                  value:
                    error: BOOKING_NOT_FOUND
                    legacyCode: null
                    message: Booking 99999 not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: BOOKING_NOT_FOUND"
      summary: Get a booking
      tags:
      - Bookings
  /api/v2/bookings/{bookingId}/attendance:
    post:
      operationId: attendance
      parameters:
      - in: path
        name: bookingId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDto"
          description: OK
        "400":
          content:
            application/json:
              examples:
                BAD_REQUEST:
                  summary: BAD_REQUEST
                  value:
                    error: BAD_REQUEST
                    message: Failed to convert value of type 'java.lang.String' to
                      required type 'int'
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: BAD_REQUEST"
        "401":
          content:
            application/json:
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    error: UNAUTHORIZED
                    legacyCode: null
                    message: X-Service-Token missing or invalid
              schema:
                $ref: "#/components/schemas/ServiceTokenError"
          description: "Unauthorized: UNAUTHORIZED"
        "404":
          content:
            application/json:
              examples:
                BOOKING_NOT_FOUND:
                  summary: BOOKING_NOT_FOUND
                  value:
                    error: BOOKING_NOT_FOUND
                    legacyCode: null
                    message: Booking 99999 not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: BOOKING_NOT_FOUND"
        "409":
          content:
            application/json:
              examples:
                NOT_CANCELLABLE:
                  summary: NOT_CANCELLABLE (legacy 50004)
                  value:
                    error: NOT_CANCELLABLE
                    legacyCode: 50004
                    message: Booking 1201 is CANCELLED
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Rule violation: NOT_CANCELLABLE"
      security:
      - serviceToken: []
      summary: Record attendance (BOOKED -> ATTENDED; already ATTENDED is a no-op).
        Called by results-service on result ingestion
      tags:
      - Bookings
  /api/v2/bookings/{bookingId}/reschedule:
    post:
      operationId: reschedule
      parameters:
      - in: path
        name: bookingId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResultDto"
          description: Created
        "400":
          content:
            application/json:
              examples:
                VALIDATION:
                  summary: VALIDATION
                  value:
                    error: VALIDATION
                    legacyCode: null
                    message: sessionId and candidateNumber are required
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: VALIDATION"
        "404":
          content:
            application/json:
              examples:
                BOOKING_NOT_FOUND:
                  summary: BOOKING_NOT_FOUND
                  value:
                    error: BOOKING_NOT_FOUND
                    legacyCode: null
                    message: Booking 99999 not found
                SESSION_NOT_FOUND:
                  summary: SESSION_NOT_FOUND
                  value:
                    error: SESSION_NOT_FOUND
                    legacyCode: null
                    message: Session 99999 not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: BOOKING_NOT_FOUND, SESSION_NOT_FOUND"
        "409":
          content:
            application/json:
              examples:
                DIFFERENT_EXAM:
                  summary: DIFFERENT_EXAM (legacy 50006)
                  value:
                    error: DIFFERENT_EXAM
                    legacyCode: 50006
                    message: Booking 1201 cannot be moved to session 155 (different
                      exam)
                DUPLICATE_BOOKING:
                  summary: DUPLICATE_BOOKING (legacy 50002)
                  value:
                    error: DUPLICATE_BOOKING
                    legacyCode: 50002
                    message: Candidate NW00000901 already has an active booking on
                      session 154
                NOT_CANCELLABLE:
                  summary: NOT_CANCELLABLE (legacy 50004)
                  value:
                    error: NOT_CANCELLABLE
                    legacyCode: 50004
                    message: Booking 1201 is CANCELLED
                NOT_ELIGIBLE:
                  summary: NOT_ELIGIBLE
                  value:
                    error: NOT_ELIGIBLE
                    legacyCode: null
                    message: "Candidate NW00000939 is not eligible to book MHL-RN1\
                      \ (RETAKE_WAIT_NOT_ELAPSED), earliest retake date 2026-12-07"
                NO_ACCOMMODATION_SEAT:
                  summary: NO_ACCOMMODATION_SEAT (legacy 50003)
                  value:
                    error: NO_ACCOMMODATION_SEAT
                    legacyCode: 50003
                    message: No accommodation seat available on session 155
                SAME_SESSION:
                  summary: SAME_SESSION
                  value:
                    error: SAME_SESSION
                    legacyCode: null
                    message: Booking 1201 is already on session 154
                SESSION_NOT_OPEN:
                  summary: SESSION_NOT_OPEN (legacy 50001)
                  value:
                    error: SESSION_NOT_OPEN
                    legacyCode: 50001
                    message: Session 263 is not open for booking
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Rule violation: NOT_CANCELLABLE, SAME_SESSION, DIFFERENT_EXAM,\
            \ SESSION_NOT_OPEN, DUPLICATE_BOOKING, NO_ACCOMMODATION_SEAT, NOT_ELIGIBLE"
      summary: "Reschedule a booking to another session of the same exam (cancel +\
        \ book, new booking id, ODD-05)"
      tags:
      - Bookings
  /api/v2/candidates/{candidateNumber}:
    get:
