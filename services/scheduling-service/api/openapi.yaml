                $ref: "#/components/schemas/ApiError"
          description: "Not found: CANDIDATE_NOT_FOUND"
      summary: Get a candidate profile
      tags:
      - Candidates
  /api/v2/candidates/{candidateNumber}/bookings:
    get:
      operationId: candidateBookings
      parameters:
      - in: path
        name: candidateNumber
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingDto"
          description: OK
        "404":
          content:
            application/json:
              examples:
                CANDIDATE_NOT_FOUND:
                  summary: CANDIDATE_NOT_FOUND
                  value:
                    error: CANDIDATE_NOT_FOUND
                    legacyCode: null
                    message: Candidate NW00009999 not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: CANDIDATE_NOT_FOUND"
      summary: List a candidate's bookings
      tags:
      - Candidates
  /api/v2/candidates/{candidateNumber}/eligibility:
    get:
      operationId: eligibility
      parameters:
      - in: path
        name: candidateNumber
        required: true
        schema:
          type: string
      - in: query
        name: examCode
        required: true
        schema:
          type: string
      - in: query
        name: date
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityDto"
          description: OK
        "400":
          content:
            application/json:
              examples:
                VALIDATION:
                  summary: VALIDATION
                  value:
                    error: VALIDATION
                    legacyCode: null
                    message: sessionId and candidateNumber are required
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid input: VALIDATION"
        "404":
          content:
            application/json:
              examples:
                CANDIDATE_NOT_FOUND:
                  summary: CANDIDATE_NOT_FOUND
                  value:
                    error: CANDIDATE_NOT_FOUND
                    legacyCode: null
                    message: Candidate NW00009999 not found
                EXAM_NOT_FOUND:
                  summary: EXAM_NOT_FOUND
                  value:
                    error: EXAM_NOT_FOUND
                    legacyCode: null
                    message: Exam NOPE not found
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Not found: CANDIDATE_NOT_FOUND, EXAM_NOT_FOUND"
      summary: "Check retake eligibility for an exam (calendar days, ODD-04)"
      tags:
      - Candidates
  /api/v2/centers:
    get:
      operationId: centers
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
