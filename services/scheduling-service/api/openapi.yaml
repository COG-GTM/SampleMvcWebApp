          description: "Server-local clock of the system that recorded it: the scheduling\
            \ service for new writes, the legacy estate for imported rows (not centre-local;\
            \ docs/as-is/smoke-test.md, HB-25, MR-06), ISO-8601 without offset"
          example: 2026-11-11T09:15:00
