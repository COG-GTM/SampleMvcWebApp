# capacity-sync - local development
server.port=8083

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AssessmentDelivery
spring.datasource.username=ad_capacity_sync
spring.datasource.password=${AD_DB_PASSWORD:CapSync!Dev2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.tomcat.max-active=5
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query=SELECT 1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

logging.level.com.northwind=INFO

capacity.sync.audit-actor=capacity-sync
# MBA-3823: scheduling-service owns SeatsAvailable; true restores the legacy nightly write (HB-03)
capacity.sync.enabled=false
