# booking-api - local development
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AssessmentDelivery
spring.datasource.username=ad_app
spring.datasource.password=${AD_DB_PASSWORD:Northw1nd!Dev2011}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.tomcat.max-active=20
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query=SELECT 1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# partner channel identity written to Booking.Channel / AuditLog.Actor
booking.channel=PARTNER
booking.audit-actor=booking-api

logging.level.com.northwind=INFO
