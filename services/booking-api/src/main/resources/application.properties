# booking-api - local development
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AssessmentDelivery
# per-component login (MBA-3823, db/schema/000_create_database.sql); legacy booking/seat writes are denied to it
spring.datasource.username=ad_booking_api
spring.datasource.password=${AD_DB_PASSWORD:B00king!Dev2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.tomcat.max-active=20
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query=SELECT 1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# partner channel identity written to Booking.Channel / AuditLog.Actor
booking.channel=PARTNER
booking.audit-actor=booking-api

logging.level.com.northwind=INFO

# MBA-3823: booking writes go through the routing layer to scheduling-service (the single writer)
booking.scheduling-url=${ROUTING_URL:http://localhost:8000}
booking.scheduling-timeout-ms=10000
# how long v1 waits for the outbox relay to assign the AssessmentDelivery BookingId
booking.relay-wait-ms=3000
