# results-service - Azure App Service (activate with --spring.profiles.active=azure)
# Real values come from App Service application settings. Do not commit secrets.
spring.datasource.url=jdbc:sqlserver://<your-server>.database.windows.net:1433;database=AssessmentDelivery;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=<ad_results-login>
spring.datasource.password=${AZURE_SQL_PASSWORD}

spring.jackson.serialization.indent-output=false
logging.level.com.northwind=WARN
results.scheduling-url=${ROUTING_URL}
