# results-service - local development
server.port=8082

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AssessmentDelivery
spring.datasource.username=ad_results
spring.datasource.password=${AD_DB_PASSWORD:Resu1ts!Dev2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.tomcat.max-active=20
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query=SELECT 1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

logging.level.com.northwind=INFO

# score files from the delivery partners are small, a few thousand rows at most
spring.http.multipart.max-file-size=5MB
spring.http.multipart.max-request-size=5MB
results.audit-actor=results-service
# MBA-3823: attendance is recorded by scheduling-service (single writer); its relay projects ATTENDED into
# dbo.Booking. Empty = legacy direct UPDATE (only for a pre-coexistence database without 040_single_writer.sql).
results.scheduling.base-url=${SCHEDULING_BASE_URL:http://localhost:8090}
results.scheduling.timeout-ms=5000
