# routing-gateway allow-list. Edit and save: the gateway picks the change up within ~1 s (or POST /actuator/refresh).
# Rollback = remove the center code from the list.
#
# routing.modern-centers: TestCenter.CenterCode values whose booking/capacity traffic goes to scheduling-service.
# Until the M4 outbox relay is live only routing.test-centers may be listed (default BOS01,SEA01,AKL01),
# otherwise the gateway refuses to start / rejects the refresh unless routing.coexistence-mode=relay.
routing.modern-centers=BOS01
