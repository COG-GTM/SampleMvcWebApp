# Strangler allow-list (MBA-3822): TestCenter.CenterCode values whose booking + capacity traffic goes to
# scheduling-service. Empty = everything goes to legacy. Reloaded within ~1 s of saving this file
# (ConfigFileWatcher) or on POST /actuator/refresh. Rollback = remove the code and save.
# MBA-3823 (M4): routing.coexistence-mode=relay is the default, so any centre may be listed; * = every centre.
# scheduling-service is then the single writer of bookings and seat counts (db/security/040_single_writer.sql
# denies the legacy logins) and its outbox relay projects each change back into AssessmentDelivery.
routing.modern-centers=*
