# routing-gateway - strangler facade in front of the portal (:8080) and booking-api (:8081)
server.port=8000
spring.application.name=routing-gateway

# Allow-list file (optional). Its routing.modern-centers / routing.test-centers / routing.coexistence-mode
# override the values below; it is polled every routing.watch-interval and re-read on POST /actuator/refresh.
routing.config-file=config/routing.properties

routing.portal-url=http://localhost:8080
routing.booking-api-url=http://localhost:8081
routing.results-service-url=http://localhost:8082
routing.capacity-sync-url=http://localhost:8083
routing.scheduling-service-url=http://localhost:8090

# TestCenter.CenterCode values routed to scheduling-service. Empty = fully transparent gateway.
routing.modern-centers=
# Seeded centers that are test/demo centers and may be allow-listed before the M4 outbox relay is live.
routing.test-centers=BOS01,SEA01,AKL01
# none | relay. 'relay' (set by M4) lifts the test-center restriction.
routing.coexistence-mode=none

routing.modern-booking-id-floor=50000000
routing.resolve-timeout=2s
routing.watch-interval=1s

management.endpoints.web.exposure.include=health,info,refresh,env
management.endpoint.env.show-values=NEVER

# Upstream timeouts
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=30s

logging.level.routing=INFO
