# Test profile: isolated in-memory H2 (MSSQLServer mode, like the default file DB) per Spring test context.
spring.datasource.url=jdbc:h2:mem:samplemvcwebapp-test-${random.uuid};MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
app.seed-on-startup=false
