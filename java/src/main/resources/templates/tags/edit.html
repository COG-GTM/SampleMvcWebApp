<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Edit', ~{::#content}, true)}">
<body>
<div id="content" th:remove="tag">
<h2>Edit</h2>

<form method="post" th:action="@{/Tags/Edit/{id}(id=${tag.tagId})}" th:object="${tag}">
    <div class="form-horizontal">
        <h4>Tag</h4>
        <hr />
        <div th:replace="~{fragments/forms :: validationSummary}"></div>
        <input type="hidden" th:field="*{tagId}" />

        <div class="form-group">
            <label class="control-label col-md-2" for="name">Name</label>
            <div class="col-md-10">
                <input class="form-control text-box single-line" type="text" th:field="*{name}"
                       data-val="true" data-val-required="The Name field is required."
                       data-val-maxlength="The field Name must be a string or array type with a maximum length of '128'." data-val-maxlength-max="128" />
                <span th:replace="~{fragments/forms :: validationMessage('name')}"></span>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-md-2" for="slug">Slug</label>
            <div class="col-md-10">
                <input class="form-control text-box single-line" type="text" th:field="*{slug}"
                       data-val="true" data-val-required="The Slug field is required."
                       data-val-maxlength="The field Slug must be a string or array type with a maximum length of '64'." data-val-maxlength-max="64" />
                <span th:replace="~{fragments/forms :: validationMessage('slug')}"></span>
            </div>
        </div>

        <div class="form-group">
            <div class="col-md-offset-2 col-md-10">
                <input type="submit" value="Save" class="btn btn-default" />
            </div>
        </div>
    </div>
</form>

<div>
    <a th:href="@{/Tags}">Back to List</a>
</div>
<hr />
<div th:replace="~{fragments/tagValidation :: tagValidation}"></div>
</div>
</body>
</html>
