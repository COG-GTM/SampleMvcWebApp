spring.application.name=sample-mvc-web-app
server.port=8080

# Default: file-based H2 so data survives restarts (legacy used LocalDB). Profile "sqlserver" targets SQL Server.
spring.datasource.url=jdbc:h2:file:./data/SampleWebAppDb;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mirrors Settings.HostTypeString in the legacy Web.config; shown in the footer as "Hosted on <value>".
app.host-type=LocalHost
# Legacy starts with an empty database and only loads data on Posts > Reset. Set true to seed an empty DB on startup.
app.seed-on-startup=false
