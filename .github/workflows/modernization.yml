name: modernization

on:
  push:
    branches: [master, 'devin/**', 'plugin/**']
  pull_request:
  workflow_dispatch:

env:
  LB_PORT: "8000"
  PROM_PORT: "9091"

jobs:
  build-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tfm
        name: detect target framework
        run: |
          tfm=$(grep -o '<TargetFramework[^>]*>[^<]*' SampleWebApp/SampleWebApp.csproj | head -1 | sed 's/.*>//')
          echo "tfm=$tfm" >> "$GITHUB_OUTPUT"
          echo "target framework: $tfm"

      # legacy (.NET Framework 4.x): build + NUnit on mono, matching infra/legacy/Dockerfile.mono
      - name: build + test (mono, .NET Framework)
        if: startsWith(steps.tfm.outputs.tfm, 'v4')
        env:
          SA_PASSWORD: CiOnly_Str0ngP@ss
        run: |
          # the EF6 tests target (localdb) which is Windows-only; point Tests.dll.config at a throwaway SQL Server
          docker run -d --name ci-mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest
          for _ in $(seq 1 30); do
            docker exec ci-mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network host -e SA_PASSWORD -v "$PWD:/src" -w /src mono:6.12 bash -ec '
            nuget restore SampleWebApp.sln
            msbuild SampleWebApp.sln /p:Configuration=Release /v:m /nologo
            nuget install NUnit.Runners -Version 2.6.4 -OutputDirectory packages
            sed -i "s|Data Source=(localdb)\\\\mssqllocaldb;Initial Catalog=TestSampleWebAppDb;MultipleActiveResultSets=True;Integrated Security=SSPI;Trusted_Connection=True|Server=localhost,1433;Database=TestSampleWebAppDb;User Id=sa;Password=$SA_PASSWORD;MultipleActiveResultSets=True|" Tests/bin/Release/Tests.dll.config
            mono packages/NUnit.Runners.2.6.4/tools/nunit-console.exe Tests/bin/Release/Tests.dll -noshadow -nologo'
          docker rm -f ci-mssql

      # modern (.NET 8): dotnet build / test
      - name: setup dotnet
        if: ${{ !startsWith(steps.tfm.outputs.tfm, 'v4') }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet build + test
        if: ${{ !startsWith(steps.tfm.outputs.tfm, 'v4') }}
        run: |
          dotnet build SampleWebApp.sln -c Release
          dotnet test SampleWebApp.sln -c Release --no-build

  infra-verify:
    name: container + infra/ + make verify
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: secrets stub (infra/secrets/.env from .env.example)
        run: make -C infra secrets

      - name: build app container (runtime pin from Dockerfile / infra/terraform)
        run: docker compose --env-file infra/secrets/.env -f infra/docker-compose.yml build app

      - name: make up
        run: make up

      - name: make verify (health via nginx + smoke + DB dependency + load gate vs demo/BASELINE.json)
        run: make verify

      - name: collect logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --env-file infra/secrets/.env -f infra/docker-compose.yml ps > artifacts/ps.txt || true
          docker compose --env-file infra/secrets/.env -f infra/docker-compose.yml logs --no-color > artifacts/compose.log || true
          cp -r load/out artifacts/load-out 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infra-verify
          path: artifacts/

      - name: make down
        if: always()
        run: make down

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
