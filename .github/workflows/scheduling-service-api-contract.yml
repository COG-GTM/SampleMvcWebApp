# MBA-3833: scheduling-service API contract gate. `mvn verify` runs the spec drift check (OpenApiSpecIT),
# the breaking-change check against api/baseline (OpenApiCompatibilityTest), the consumer contract provider
# verification (*ContractIT) and the frontend type check against api/openapi.yaml (npm run build).
name: scheduling-service API contract

on:
  pull_request:
    paths:
      - 'services/scheduling-service/**'
      - '.github/workflows/scheduling-service-api-contract.yml'
  push:
    branches: [estate/legacy-baseline]
    paths:
      - 'services/scheduling-service/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scheduling-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: ./mvnw -B verify
      - name: Upload generated spec on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated
          path: services/scheduling-service/target/openapi.generated.yaml
          if-no-files-found: ignore
