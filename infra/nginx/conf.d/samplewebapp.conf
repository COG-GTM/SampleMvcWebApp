# Load balancer for SampleWebApp.
# Runtime contract (must match the app image): upstream port 80 (IIS), health probe /Home/Health.
# Same values are pinned in terraform/variables.tf (app_port, app_health_path) and firewall/allowlist.rules.
upstream samplewebapp {
    server app.svc.internal:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name samplewebapp.demo.local _;

    # Firewall: only the allowlist (firewall/allowlist.rules -> generated allow/deny) may reach the LB.
    include /etc/nginx/firewall/lb-access.conf;

    # LB health probe -> app health endpoint. Used by `make verify` and the docker healthcheck.
    location = /healthz {
        access_log off;
        proxy_pass http://samplewebapp/Home/Health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
    }

    # LB self status (nginx stub_status) for Prometheus.
    location = /nginx_status {
        stub_status;
        allow 172.28.0.0/24;
        deny all;
    }

    location / {
        proxy_pass http://samplewebapp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
