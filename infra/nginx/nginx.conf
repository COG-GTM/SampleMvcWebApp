user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Parsed by observability/nginxlog-exporter (latency histograms per route) — keep format in sync.
    log_format lb_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
        '"upstream":"$upstream_addr","service":"samplewebapp","env":"demo"}';
    access_log /var/log/nginx/lb-access.log lb_json;

    sendfile on;
    keepalive_timeout 65;

    # Service names resolve via dns/ (CoreDNS hosts file), not Docker's embedded DNS.
    resolver 172.28.0.53 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
